id: aska
name: ASKA Dedicated Server
image: jimbit0/aska-dedicated-server:unstable
description: ASKA dedicated server (Windows server run under Proton-GE). The first start downloads the game from Steam and takes several minutes.
notes: >-
  Needs a Steam Game Server Login Token (GSLT): create it at https://steamcommunity.com/dev/managegameservers under
  "Create a new game server account" with App ID 1898300 (the base game; the server itself installs as Steam app 3246670, a
  different number). A Steam Web API key (from /dev/apikey) looks similar but is NOT the same thing and is refused by Steam.
  The image wants 4+ CPU cores, 8 GB+ RAM and a kernel 5.16+. Game and query ports are 27015 and 27016 (UDP), which are also
  Palworld's default ports: give one of the two games other host ports. Source of the settings: the image's Docker Hub page
  (tag unstable, version 0.2.1). Deliberately left out: the performance and debugging settings (worker threads, CPU cap,
  profiling, crash pattern, virtual display size), the Steam update/validate switches and the in-container port numbers.
  Not verified on real hardware yet: the format of the settings file (Check setup reports it after the first start).
ports:
  - {protocol: udp, host: 27015, container: 27015}
  - {protocol: udp, host: 27016, container: 27016}
volumes:
  - {host: ./server, container: /home/steam/aska_server}
  - {host: ./saves, container: /aska-saves}
fields:
  - name: ASKA_DISPLAY_NAME
    label: Server name (shown in the server browser)
    default: My ASKA Server
    required: true
    description: The name players see in the in-game server list.
  - name: ASKA_SERVER_NAME
    label: Internal server identifier
    default: aska-server
    required: true
    description: A short internal name for this server (letters, digits and dashes).
  - name: ASKA_AUTH_TOKEN
    label: Steam Game Server Login Token
    secret: true
    required: true
    pattern: '[0-9A-Fa-f]{32}'
    pattern_hint: A Game Server Login Token is exactly 32 letters and digits (0-9 and A-F) with no spaces. Paste only the token.
    description: >-
      Create it at https://steamcommunity.com/dev/managegameservers under "Create a new game server account" with App ID 1898300.
      It is a 32-character token. It is NOT the Steam Web API key from /dev/apikey (that one looks the same but Steam
      refuses it: the server then starts, never becomes ready, and the log says CustomAuthenticationFailed).
  - name: ASKA_PASSWORD
    label: Join password
    secret: true
    description: Players must type this to join. Leave empty for an open server.
  - name: ASKA_REGION
    label: Region
    default: default
    type: string           # deliberately loose: the image README says "default, Asia, EU, US, etc." and the game's own list differs
    description: "default, Asia, EU, US and so on: the region the server is listed under (the image's README does not give the full list, so GameDock does not restrict it)."
  - name: ASKA_MAX_PLAYERS
    label: Maximum players
    default: "4"
    pattern: '[1-9][0-9]{0,2}'
    pattern_hint: A whole number such as 4.
    type: integer
    min: 1
    description: How many players can be connected at once.
  - name: ASKA_SAVE_ID
    label: Save to load
    description: >-
      Leave empty for a new world, or to load the newest save found in the saves folder. To load a specific world, enter
      the part of its folder name after "savegame_" (for a folder savegame_0fef8_181125131111 enter 0fef8_181125131111).
  - name: ASKA_MODE
    label: Game mode
    default: normal
    # normal / custom: the game's server properties file (server hosts' ASKA docs, WindowsGSM.ASKA) agree on these two.
    choices:
      - { value: normal, label: Normal, description: The standard game balance. }
      - { value: custom, label: Custom, description: "Unlocks the world settings in the properties file (custom mode only)." }
    description: "normal = the standard game. custom = the advanced world settings in the properties file apply."
  - name: ASKA_SEED
    label: World seed
    description: The world generation seed for a NEW world. Leave empty for a random world. Has no effect on an existing save.
  - name: ASKA_KEEP_WORLD_ALIVE
    label: Keep the world running with nobody online
    default: "false"
    choices:
      - { value: "false", label: "No (pause when empty)" }
      - { value: "true", label: "Yes (keep running)" }
    description: "true = the world keeps simulating while nobody is connected. false = it pauses."
  - name: ASKA_AUTOSAVE_STYLE
    label: Autosave style
    default: every morning
    # The image passes this value straight into the game's properties file. The game's documented values (ASKA server
    # hosts' docs and WindowsGSM.ASKA agree) are the five below; the image README's "frequent, manual" are not among them.
    choices:
      - every morning
      - every 5 minutes
      - every 10 minutes
      - every 15 minutes
      - { value: disabled, label: "disabled (no autosave)" }
    description: "How often the world is saved: every morning (the default), every 5, 10 or 15 minutes, or disabled."
  - name: ASKA_SAVE_BACKUP
    label: Back up saves when the server starts
    default: "1"
    choices:
      - { value: "1", label: "Yes" }
      - { value: "0", label: "No" }
    description: "1 = the image writes a .tar.gz of the saves into saves/backups at each start. 0 = no. (GameDock's own backups are separate.)"
  - name: ASKA_KEEP_SAVES
    label: Start-up backups to keep
    default: "3"
    pattern: '[0-9]{1,3}'
    pattern_hint: A whole number such as 3.
    type: integer
    min: 0
    description: How many of those start-up backups the image keeps per world.
  - name: TZ
    label: Time zone
    description: "For example America/New_York. Affects log and backup file times. Empty = UTC."
config_files:
  - path: server/server.properties.docker.txt
    label: Server properties
    format: ini
    sensitive_keys: [password, authentication token]
    # Allowed values: the game's "server properties.txt" as documented by ASKA server hosts (xgamingserver.com/docs/aska,
    # mintservers.com, low.ms) and github.com/tadavispmd040507/WindowsGSM.ASKA. Only values those sources AGREE on are
    # restricted; day length, year length, monster density and structure decay are left out because they disagree.
    schema:
      mode: { choices: [normal, custom], default: normal, description: "custom unlocks the world settings below; with normal they are ignored." }
      autosave style:
        choices: [every morning, every 5 minutes, every 10 minutes, every 15 minutes, disabled]
        default: every morning
      keep server world alive: { type: boolean, default: "false", description: "true = the world keeps running with nobody online." }
      region: { type: string, default: default, description: "Region the server is listed under, such as default, europe, usa east (not restricted: the sources list different sets)." }
      steam game port: { type: integer, min: 1, max: 65535, description: Port inside the container; GameDock maps the host port. }
      steam query port: { type: integer, min: 1, max: 65535, description: Port inside the container; GameDock maps the host port. }
      precipitation: { type: integer, min: 0, max: 6, description: "0 = sunny ... 6 = soggy (custom mode)." }
      invasion difficulty: { choices: ["off", easy, normal, hard], description: Raid difficulty (custom mode). }
      monster population: { choices: [low, medium, high], description: custom mode. }
      wulfar population: { choices: [low, medium, high], description: custom mode. }
      herbivore population: { choices: [low, medium, high], description: custom mode. }
      bear population: { choices: [low, medium, high], description: custom mode. }
      terrain aspect: { choices: [smooth, normal, rocky], description: custom mode. }
      terrain height: { choices: [flat, normal, varied], description: custom mode. }
      starting season: { choices: [spring, summer, autumn, winter], description: custom mode. }
    note: The image may rewrite this file from the settings above when it starts, so prefer changing the settings on the server (Edit). Useful for reading what the game really uses.
fail_log_patterns:
  - pattern: 'k_EResultGSLTExpired'
    title: Steam says the login token has expired.
    advice: >-
      On https://steamcommunity.com/dev/managegameservers regenerate the token, or delete it and create a new one for App
      ID 1898300, then stop the server, click Edit, paste the new token and start it again. If new tokens also show as
      expired, the Steam account may be limited (for example no phone number on the account).
  - pattern: 'CustomAuthenticationFailed|k_EResultAccountNotFound'
    title: Steam rejected the login token (CustomAuthenticationFailed).
    advice: >-
      Check that the token was created at https://steamcommunity.com/dev/managegameservers for App ID 1898300 (not a Steam
      Web API key from /dev/apikey), that it was copied completely, and that it has not been deleted or regenerated. Then
      stop the server, click Edit, paste the new token and start it again.
  - pattern: 'OutOfMemoryException|Segmentation fault|Application will be terminated|Crash!!!'
    title: The ASKA server crashed while starting.
    advice: >-
      Open Logs and read the lines just above this one. The server wants 8 GB or more of free memory and 4 or more CPU
      cores: stop other servers if the machine is short. The image keeps a crash report in server/logs (crash_*.log).
log_files:
  - server/logs/aska_game_output.log
update_method: pull_recreate
update_note: The Update button downloads the newest image. The game itself is downloaded from Steam at every start (Update game restarts the server to do that).
steam_app_id: "3246670"
game_update_method: restart
stop_timeout: 90
backup_stop_first: false
ready_log_pattern: The session is now open!
