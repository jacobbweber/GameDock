[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamedock"
version = "0.1.0"
description = "Small self-hosted manager for dockerized game servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gamedock = "gamedock.__main__:main"

[tool.setuptools.packages.find]
include = ["gamedock*"]

[tool.setuptools.package-data]
gamedock = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
