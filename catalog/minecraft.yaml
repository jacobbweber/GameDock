# EXAMPLE VALUES: verify the image, ports and variables before real use.
id: minecraft-java
name: Minecraft (Java) Server
image: itzg/minecraft-server:latest
description: Minecraft Java Edition server using a popular community image.
notes: Example values. You must accept the Minecraft EULA (https://aka.ms/MinecraftEULA) by setting EULA to TRUE.
update_note: >-
  Minecraft servers update when the image's VERSION setting says so (LATEST by default picks the newest release at each
  start), so a restart can also bring a new game version. "Update available" only means the image itself has a newer
  version; Update now replaces it and keeps your world.
ports:
  - { protocol: tcp, host: 25565, container: 25565 }
volumes:
  - { host: ./data, container: /data }
config_files:               # editable from the Config button (example path; verify)
  - path: data/server.properties
    label: server.properties
    format: ini
    sensitive_keys: [rcon.password]
  - path: data/ops.json
    label: Operators (ops.json)
    format: json
# Run the game as the user GameDock runs as, so the files it writes can be backed up, edited and deleted without
# repairs. Documented in https://docker-minecraft-server.readthedocs.io/en/latest/variables/ (UID/GID, default 1000).
user_env: { UID: uid, GID: gid }
fields:
  - { name: EULA, label: Accept Minecraft EULA (TRUE or FALSE), default: "FALSE", required: true }
  - { name: VERSION, label: Minecraft version, default: LATEST }
  - { name: MEMORY, label: Java memory, default: 2G }
  - { name: MOTD, label: Message of the day, default: "A GameDock server" }
