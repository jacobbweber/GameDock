# EXAMPLE VALUES: verify the image, ports and variables before real use.
id: valheim
name: Valheim Dedicated Server
image: lloesche/valheim-server:latest
description: Valheim dedicated server using a popular community image.
notes: Example values. Check the image documentation before real use. The server password must be at least 5 characters.
steam_app_id: 896660                 # Valheim Dedicated Server (the install lives in ./server, so the Steam record is readable)
game_update_method: restart          # the image updates the game when the container starts
update_note: >-
  This image checks for a new Valheim server version while it runs and when it starts (its UPDATE_CRON, on by default),
  so a restart also brings the game up to date. GameDock compares the installed Steam build with the newest public one;
  "Update game" backs up, restarts and checks that the build changed. A separate "image update" only replaces the helper
  program around the game and keeps your world.
ports:
  - { protocol: udp, host: 2456, container: 2456 }
  - { protocol: udp, host: 2457, container: 2457 }
volumes:
  - { host: ./config, container: /config }
  - { host: ./server, container: /opt/valheim }
config_files:               # editable from the Config button (example path; verify)
  - path: config/adminlist.txt
    label: Admin list (Steam IDs)
    format: text
    hot_edit: true
# Run the game as the user GameDock runs as, so the files it writes can be backed up, edited and deleted without
# repairs. Documented in https://github.com/community-valheim-tools/valheim-server-docker#environment-variables (PUID/PGID, default 0 = root).
user_env: { PUID: uid, PGID: gid }
fields:
  - { name: SERVER_NAME, label: Server name, default: "My Valheim Server", required: true }
  - { name: WORLD_NAME, label: World name, default: "Dedicated", required: true }
  - { name: SERVER_PASS, label: Server password, secret: true, required: true,
      pattern: '.{5,}', pattern_hint: "The password must be at least 5 characters (the image's README: otherwise the server refuses to start)",
      description: At least 5 characters. }
