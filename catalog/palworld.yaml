# EXAMPLE VALUES: verify the image, ports and variables before real use.
id: palworld
name: Palworld Dedicated Server
image: thijsvanloef/palworld-server-docker:latest
description: Palworld dedicated server using a popular community image.
notes: >-
  Example values. Check the image documentation before real use. The first start downloads about 5 GB, so the server
  shows "Installing" and then "Starting" before it can be joined. This image rewrites PalWorldSettings.ini from the
  settings below every time it starts, so edits made in the config editor are lost unless you set
  DISABLE_GENERATE_SETTINGS to true. Joining by address: in the game's Join by address box, Palworld always shows an
  "Input password" popup whose OK button stays disabled while the box is empty. If the server has no password, type a
  single space and press OK.
# The container is "running" long before the game can be joined: on first start it downloads ~5 GB through SteamCMD.
# GameDock uses the image's Docker health check, and these two optional log patterns, to show Installing / Starting
# instead of Running until the server really accepts players.
ready_log_pattern: "Running Palworld dedicated server on"      # used when there is no health check or it lags behind
progress_log_pattern: "progress: *([0-9]+(?:[.][0-9]+)?)"      # SteamCMD: "Update state (0x61) downloading, progress: 51.68"
# How updates work for this image (shown next to the Update button), and optional backup hints.
# Game version tracking (see docs/ARCHITECTURE.md): Steam's server app id, and a log line that shows the game's own version.
steam_app_id: 2394010                                          # Palworld Dedicated Server
version_log_pattern: "Game version is (v?[0-9.]+)"             # log line: "Game version is v1.0.5.102999"
game_update_method: restart                                    # the image updates the game when the container starts
update_note: >-
  This image downloads the newest Palworld server files with SteamCMD every time the container starts (UPDATE_ON_BOOT
  is switched on below), so restarting the server is how the game itself gets updated. GameDock compares the installed
  Steam build with the newest public one: "Update game" backs up, restarts and checks that the build changed. A
  separate "image update" only replaces the helper program around the game and keeps your world.
# Run inside the game container before a backup that does not stop the server, so the world is written to disk first.
# Unverified: it needs the image's RCON to be enabled (the image's default). A failure only adds a note.
save_command: [rcon-cli, save]
ports:
  - { protocol: udp, host: 8211, container: 8211 }
  - { protocol: udp, host: 27015, container: 27015 }
volumes:
  - { host: ./palworld, container: /palworld }
env:
  UPDATE_ON_BOOT: "true"       # the image runs SteamCMD at every start, which is how "Update game" works
  PORT: "8211"
  QUERY_PORT: "27015"
config_files:               # editable from the Config button (example path; verify)
  - path: palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
    label: Palworld settings
    note: >-
      The image regenerates this file from the server settings (name, players, passwords...) on every start. To keep
      hand edits made here, set "Keep hand-edited settings file" to true in the server's Edit dialog after the first
      full start.
    format: ini
    sensitive_keys: [AdminPassword, ServerPassword]
    # Allowed values (0.6.3). Sources: Pocketpair's server guide https://docs.palworldgame.com/settings-and-operation/configuration/
    # (DeathPenalty, RandomizerType, LogFormatType, the b... switches, the ranges named there) and the image README
    # https://github.com/thijsvanloef/palworld-server-docker (Difficulty None/Normal/Difficult, players 1-32, booleans).
    # Rates are plain numbers: neither source gives a range, so none is enforced. Unlisted settings are not checked.
    schema:
      Difficulty: { choices: [None, Normal, Difficult], description: "Game difficulty (image README). Other words are not accepted." }
      DeathPenalty:
        choices:
          - { value: None, label: Drop nothing }
          - { value: Item, label: "Drop items, keep equipment" }
          - { value: ItemAndEquipment, label: Drop items and equipment }
          - { value: All, label: Drop items and the Pals in the party }
        default: Item
        description: What players drop when they die.
      RandomizerType: { choices: [None, Region, All], default: None, description: "Pal spawn randomization: none, per region, or fully random." }
      LogFormatType: { choices: [Text, Json], default: Text, description: Log format. }
      ServerPlayerMaxNum: { type: integer, min: 1, max: 32, description: "Maximum players (the image allows 1-32)." }
      BaseCampMaxNumInGuild: { type: integer, max: 10, description: "Bases per guild (default 4, max 10)." }
      BaseCampWorkerMaxNum: { type: integer, max: 50, description: "Pals working per base (max 50)." }
      ServerReplicatePawnCullDistance: { type: number, min: 5000, max: 15000, description: "Pal sync distance in cm (5000-15000)." }
      FishingDifficultyRate: { type: number, min: 0.1, max: 1.0, description: "Fishing difficulty (0.1-1.0)." }
      PublicPort: { type: integer, min: 1, max: 65535 }
      RCONPort: { type: integer, min: 1, max: 65535 }
      RESTAPIPort: { type: integer, min: 1, max: 65535 }
      MaxBuildingLimitNum: { type: integer, description: "Buildings per player; 0 = unlimited." }
      GuildPlayerMaxNum: { type: integer }
      ChatPostLimitPerMinute: { type: integer }
      SupplyDropSpan: { type: number, description: Minutes between supply drops. }
      bAllowClientMod: { type: boolean }
      bEnableBuildingPlayerUIdDisplay: { type: boolean }
      bIsShowJoinLeftMessage: { type: boolean }
      bIsUseBackupSaveData: { type: boolean }
      RCONEnabled: { type: boolean }
      RESTAPIEnabled: { type: boolean }
      bAllowEnemyCampSpawnNearBaseCamp: { type: boolean }
      bAllowEnhanceStat_Attack: { type: boolean }
      bAllowEnhanceStat_Health: { type: boolean }
      bAllowEnhanceStat_Stamina: { type: boolean }
      bAllowEnhanceStat_Weight: { type: boolean }
      bAllowEnhanceStat_WorkSpeed: { type: boolean }
      bAllowGlobalPalboxExport: { type: boolean }
      bAllowGlobalPalboxImport: { type: boolean }
      bAutoResetGuildNoOnlinePlayers: { type: boolean }
      bBuildAreaLimit: { type: boolean }
      bCharacterRecreateInHardcore: { type: boolean }
      bDisplayPvPItemNumOnWorldMap_BaseCamp: { type: boolean }
      bDisplayPvPItemNumOnWorldMap_Player: { type: boolean }
      bEnableFastTravel: { type: boolean }
      bEnableFastTravelOnlyBaseCamp: { type: boolean }
      bEnableInvaderEnemy: { type: boolean }
      bEnableVoiceChat: { type: boolean }
      bExistPlayerAfterLogout: { type: boolean }
      bHardcore: { type: boolean }
      bInvisibleOtherGuildBaseCampAreaFX: { type: boolean }
      bIsPvP: { type: boolean }
      bIsRandomizerPalLevelRandom: { type: boolean }
      bIsStartLocationSelectByMap: { type: boolean }
      bShowPlayerList: { type: boolean }
      bAdditionalDropItemWhenPlayerKillingInPvPMode: { type: boolean }
      bPalLost: { type: boolean }
      bEnablePlayerToPlayerDamage: { type: boolean }
      bEnableFriendlyFire: { type: boolean }
      bActiveUNKO: { type: boolean }
      bEnableAimAssistPad: { type: boolean }
      bEnableAimAssistKeyboard: { type: boolean }
      bIsMultiplay: { type: boolean }
      bCanPickupOtherGuildDeathPenaltyDrop: { type: boolean }
      bEnableNonLoginPenalty: { type: boolean }
      bEnableDefenseOtherGuildPlayer: { type: boolean }
      bUseAuth: { type: boolean }
      DayTimeSpeedRate: { type: number }
      NightTimeSpeedRate: { type: number }
      ExpRate: { type: number }
      PalCaptureRate: { type: number }
      PalSpawnNumRate: { type: number }
      PalDamageRateAttack: { type: number }
      PalDamageRateDefense: { type: number }
      PlayerDamageRateAttack: { type: number }
      PlayerDamageRateDefense: { type: number }
      PlayerStomachDecreaceRate: { type: number }
      PlayerStaminaDecreaceRate: { type: number }
      PlayerAutoHPRegeneRate: { type: number }
      PlayerAutoHpRegeneRateInSleep: { type: number }
      PalStomachDecreaceRate: { type: number }
      PalStaminaDecreaceRate: { type: number }
      PalAutoHPRegeneRate: { type: number }
      PalAutoHpRegeneRateInSleep: { type: number }
      BuildObjectHpRate: { type: number }
      BuildObjectDamageRate: { type: number }
      BuildObjectDeteriorationDamageRate: { type: number }
      CollectionDropRate: { type: number }
      CollectionObjectHpRate: { type: number }
      CollectionObjectRespawnSpeedRate: { type: number }
      EnemyDropItemRate: { type: number }
      EquipmentDurabilityDamageRate: { type: number }
      ItemWeightRate: { type: number }
      WorkSpeedRate: { type: number }
      MonsterFarmActionSpeedRate: { type: number }
      ItemCorruptionMultiplier: { type: number }
      RespawnPenaltyTimeScale: { type: number }
    # hot_edit: false  -> the server must be stopped before saving
# Run the game as the user GameDock runs as, so the files it writes can be backed up, edited and deleted without
# repairs. Documented in https://github.com/thijsvanloef/palworld-server-docker#environment-variables (PUID/PGID, default 1000).
user_env: { PUID: uid, PGID: gid }
fields:
  - { name: SERVER_NAME, label: Server name, default: "My Palworld Server", required: true }
  - { name: PLAYERS, label: Max players, default: "16", type: integer, min: 1, max: 32 }
  - { name: SERVER_PASSWORD, label: Server password, secret: true,
      description: Leave empty for no password. }
  - { name: ADMIN_PASSWORD, label: Admin password, secret: true, required: true }
  - { name: DISABLE_GENERATE_SETTINGS, label: Keep hand-edited settings file, default: "false", choices: ["false", "true"],
      description: "false = the image rewrites PalWorldSettings.ini from these settings at every start. Set to true after the first full start to keep edits made in the config editor." }
